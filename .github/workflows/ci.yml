name: ci

on:
  push:
  pull_request:

# The generated stubs under src/ are COMMITTED (see .gitignore), so this workflow builds and tests
# the tree as it stands: no docker image, no proto compiler, no submodules. Regenerating the stubs
# from ondewo-sip-api is a separate integration concern driven by `make build` on a developer
# machine.
#
# There is deliberately not a single `[ -d ... ] || exit 0` guard below. The previous revision of
# this file skipped every step when src/ was absent, which made a repository that held no code at
# all report green.
jobs:
  lint:
    name: pre-commit (markdownlint + hygiene)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The commit-msg-stage hooks (giticket, conventional-pre-commit) are not run by
      # `--all-files`; they gate the message at commit time on a developer machine.
      - name: Run pre-commit on all files
        run: |
          python -m pip install --upgrade pre-commit
          pre-commit run --all-files --show-diff-on-failure

  php:
    name: php ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lowest and the highest interpreter composer.json claims support for. They also pick
        # different PHPUnit majors out of tools/composer.json (10.5 on 8.1, 11.5 on 8.4), so both
        # are really exercised.
        php-version: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v7

      # ext-grpc is a hard requirement of the generated stubs: every *Client.php extends
      # \Grpc\BaseStub. setup-php ships a prebuilt extension, so no PECL C++ build is needed.
      # pcov is the coverage driver the threshold gate below needs.
      # bcmath is what google/protobuf's PURE-PHP JSON parser range-checks integers with; it only
      # `suggest`s the extension, so mergeFromJsonString() on any int field dies with "Call to
      # undefined function Google\Protobuf\Internal\bccomp()" without it.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: grpc, bcmath
          coverage: pcov
          tools: composer:v2

      - name: Show the toolchain
        run: |
          php --version
          php -r 'exit(extension_loaded("grpc") ? 0 : 1);' || { echo "::error::ext-grpc did not load"; exit 1; }
          php -r 'exit(extension_loaded("bcmath") ? 0 : 1);' || { echo "::error::ext-bcmath did not load"; exit 1; }
          composer --version

      # Deliberately NOT --strict: the `version` field the release targets bump is a
      # strict-mode warning that --strict turns into a failure (rc 1). The dry run below runs
      # --strict anyway, with the deliberate warnings enumerated.
      - name: Validate composer.json
        run: make composer_validate

      # The credential-free half of `make publish`: composer validate --strict with the three
      # deliberate warnings enumerated, the agreement between ONDEWO_SIP_VERSION, composer.json,
      # RELEASE.md and (on a tag) the tag itself, and the exact update payload the real publish
      # POSTs. It holds no secret and touches no network, so the packaging path is exercised on
      # every push instead of for the first time on release day.
      - name: Packagist publishing dry run (no credentials)
        run: make packagist_dry_run

      - name: Syntax-check the hand-written PHP sources
        run: make lint_php

      # This is the PHP "build": composer generates the class map over all 11 committed stubs,
      # which is also what surfaces a duplicate class declaration.
      - name: Install the package dependencies
        run: make install_dependencies

      - name: Install the dev tool chain
        run: make install_dev_tools

      # Loads every generated class, initialises every proto descriptor, round-trips messages
      # through the wire format, constructs the service stubs - and then fails if the hand-written
      # auth/ sources drop below 100% line coverage.
      - name: Test with coverage (fails below 100% of the hand-written code)
        run: make coverage

      # `make coverage` already fails when the report is missing, and --coverage-text puts the
      # numbers in the log - this is just the machine-readable copy.
      - name: Upload the coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-php-${{ matrix.php-version }}
          path: build/coverage/clover.xml
          if-no-files-found: error
