name: ci

# `branches: ['**']` is NOT decoration: a bare `push:` also matches a TAG push, so every
# release tag used to run this whole workflow a second time alongside release.yml. Branch
# pushes and pull requests are what this gate is for; the tagged tree is release.yml's job.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository - it only builds and tests the checkout - so drop the
# default read-write GITHUB_TOKEN down to read. release.yml declares its own.
permissions:
  contents: read

# One run per branch/PR ref: a new push supersedes the in-flight run. Never on master, so every
# commit on the release branch keeps its own result instead of being cancelled by the next push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# The generated stubs under src/ are COMMITTED (see .gitignore), so this workflow builds and tests
# the tree as it stands: no docker image, no proto compiler. The php jobs check out no submodules;
# the `stubs` job fetches the public ondewo-sip-api submodule only, to compare the committed stubs
# with its .proto files. Regenerating the stubs is driven by `make build` on a developer machine.
#
# There is deliberately not a single `[ -d ... ] || exit 0` guard below. The previous revision of
# this file skipped every step when src/ was absent, which made a repository that held no code at
# all report green.
jobs:
  lint:
    name: pre-commit (markdownlint + hygiene)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout starts with a bare `git init`, and git >= 2.28 then prints a 13-line
      # "Using 'master' as the name for the initial branch" hint into every job log. Naming the
      # default up front is what silences it; master is this repository's default branch anyway.
      - name: Name git's default branch
        run: git config --global init.defaultBranch master

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The commit-msg-stage hooks (giticket, conventional-pre-commit) are not run by
      # `--all-files`; they gate the message at commit time on a developer machine.
      - name: Run pre-commit on all files
        run: |
          python -m pip install pre-commit==4.6.2
          pre-commit run --all-files --show-diff-on-failure

  # The committed stubs against the ondewo-sip-api commit the submodule pins: every .proto has
  # generated code and every rpc is served, with no stub left over (`make check_build`, the same
  # check `make test` runs before a release). Only the public api submodule is fetched.
  stubs:
    name: stubs match the pinned ondewo-sip-api
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout starts with a bare `git init`, and git >= 2.28 then prints a 13-line
      # "Using 'master' as the name for the initial branch" hint into every job log. Naming the
      # default up front is what silences it; master is this repository's default branch anyway.
      - name: Name git's default branch
        run: git config --global init.defaultBranch master

      - uses: actions/checkout@v7

      - name: Check out the ondewo-sip-api submodule
        run: git submodule update --init --depth 1 ondewo-sip-api

      - name: Compare the generated stubs with the .proto files
        run: make check_build

  php:
    name: php ${{ matrix.php-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The lowest and the highest interpreter composer.json claims support for. They also pick
        # different PHPUnit majors out of tools/composer.json (10.5 on 8.1, 11.5 on 8.4), so both
        # are really exercised.
        php-version: ['8.1', '8.4']
    steps:
      # actions/checkout starts with a bare `git init`, and git >= 2.28 then prints a 13-line
      # "Using 'master' as the name for the initial branch" hint into every job log. Naming the
      # default up front is what silences it; master is this repository's default branch anyway.
      - name: Name git's default branch
        run: git config --global init.defaultBranch master

      - uses: actions/checkout@v7

      # ext-grpc is a hard requirement of the generated stubs: every *Client.php extends
      # \Grpc\BaseStub. setup-php ships a prebuilt extension, so no PECL C++ build is needed.
      # pcov is the coverage driver the threshold gate below needs.
      # bcmath is what google/protobuf's PURE-PHP JSON parser range-checks integers with; it only
      # `suggest`s the extension, so mergeFromJsonString() on any int field dies with "Call to
      # undefined function Google\Protobuf\Internal\bccomp()" without it.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: grpc, bcmath
          coverage: pcov
          tools: composer:v2

      - name: Show the toolchain
        run: |
          php --version
          php -r 'exit(extension_loaded("grpc") ? 0 : 1);' || { echo "::error::ext-grpc did not load"; exit 1; }
          php -r 'exit(extension_loaded("bcmath") ? 0 : 1);' || { echo "::error::ext-bcmath did not load"; exit 1; }
          composer --version

      # Deliberately NOT --strict: the `version` field the release targets bump is a
      # strict-mode warning that --strict turns into a failure (rc 1). The dry run below runs
      # --strict anyway, with the deliberate warnings enumerated.
      - name: Validate composer.json
        run: make composer_validate

      # The credential-free half of `make publish`: composer validate --strict with the three
      # deliberate warnings enumerated, the agreement between ONDEWO_SIP_VERSION, composer.json,
      # RELEASE.md and (on a tag) the tag itself, and the exact update payload the real publish
      # POSTs. It holds no secret and touches no network, so the packaging path is exercised on
      # every push instead of for the first time on release day.
      - name: Packagist publishing dry run (no credentials)
        run: make packagist_dry_run

      - name: Syntax-check the hand-written PHP sources
        run: make lint_php

      # This is the PHP "build": composer generates the class map over all 11 committed stubs,
      # which is also what surfaces a duplicate class declaration.
      - name: Install the package dependencies
        run: make install_dependencies

      - name: Install the dev tool chain
        run: make install_dev_tools

      # PHP has no gRPC server: tests/Tls/MutualTlsHandshakeTest.php runs its real TLS and mutual-TLS
      # handshakes against tests/Tls/tls_test_server.py, a python grpcio server it starts itself.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install grpcio for the TLS handshake test server
        run: python -m pip install grpcio==1.82.1

      # Loads every generated class, initialises every proto descriptor, round-trips messages
      # through the wire format, constructs the service stubs - and then fails if the hand-written
      # auth/ sources drop below 100% line coverage.
      - name: Test with coverage (fails below 100% of the hand-written code)
        run: make coverage

      # `make coverage` already fails when the report is missing, and --coverage-text puts the
      # numbers in the log - this is just the machine-readable copy.
      - name: Upload the coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-php-${{ matrix.php-version }}
          path: build/coverage/clover.xml
          if-no-files-found: error
