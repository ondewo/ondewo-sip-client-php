name: release

# Packagist accepts no upload. It serves the tree of a git TAG of this repository verbatim, so
# "publishing" the PHP client is (1) the tag that `make create_release_tag` pushed and (2) a ping
# that tells Packagist to crawl it now rather than at its next scheduled pass. `make release` sends
# that ping itself, with the devops-accounts credentials; this workflow re-tests the TAGGED tree in
# a clean environment and then pings again (the ping is idempotent). `make release_verify` waits
# for this run and fails the release unless it is green.
#
# Missing PACKAGIST_* secrets do NOT turn this run red, and say so loudly instead: the tagged tree
# is still tested, the ping is skipped, and the run ends with a `::warning::` plus a job-summary
# section naming the missing secret. The local `make release` ping is the authoritative one, and
# `make release_verify` checks the result where it matters - Packagist's own p2 metadata - so a red
# run here would only report a missing redundancy as a failed release.
#
# The package must have been submitted to Packagist ONCE by hand before any ping can succeed - see
# README "Publishing to Packagist". Until then the update API answers 404 and the ping fails.
on:
  push:
    tags:
      # `make create_release_tag` pushes a BARE version tag (5.4.0), never v5.4.0.
      - '[0-9]+.[0-9]+.[0-9]+'

# The ping is idempotent, but two runs for one tag would race Packagist's crawler for nothing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Nothing here writes to the repository: the tag, the release branch and the GitHub release are
# made by `make release` on the releasing developer's machine.
permissions:
  contents: read

jobs:
  publish:
    name: publish ${{ github.ref_name }} to Packagist
    runs-on: ubuntu-24.04
    steps:
      # FIRST, before the checkout. An unset GitHub secret expands to the EMPTY string rather than
      # failing the expression, so its presence is decided here, once, and the ping below runs
      # only when both are present. Names only - the values are never printed.
      - name: Check for the Packagist credentials
        id: packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
        run: |
          missing=""
          [ -n "$PACKAGIST_USERNAME" ] || missing="$missing PACKAGIST_USERNAME"
          [ -n "$PACKAGIST_API_TOKEN" ] || missing="$missing PACKAGIST_API_TOKEN"
          echo "missing=${missing# }" >> "$GITHUB_OUTPUT"
          if [ -n "$missing" ]; then
            echo "repository secret(s) not set:$missing - the tag is tested, the Packagist ping is skipped"
          else
            echo "both Packagist secrets are present"
          fi

      # actions/checkout starts with a bare `git init`, and git >= 2.28 then prints a 13-line
      # "Using 'master' as the name for the initial branch" hint into every job log. Naming the
      # default up front is what silences it; master is this repository's default branch anyway.
      - name: Name git's default branch
        run: git config --global init.defaultBranch master

      - uses: actions/checkout@v7

      # Same toolchain as ci.yml's lower matrix leg: ext-grpc because every generated
      # <Service>Client extends \Grpc\BaseStub, pcov because the coverage gate below needs a driver,
      # and ext-bcmath because google/protobuf's pure-PHP JSON parser range-checks integers with
      # bccomp() - `make coverage` below runs the very suite that exercises that path.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: grpc, bcmath
          coverage: pcov
          tools: composer:v2

      # RELEASE_TAG is passed explicitly: a tag-triggered run always has github.ref_name, so the
      # tag/version agreement cannot silently fall back to "HEAD is not a tag, not applicable".
      - name: Packaging dry run (validates the tag against ONDEWO_SIP_VERSION)
        run: make packagist_dry_run RELEASE_TAG=${{ github.ref_name }}

      - name: Install the package dependencies
        run: make install_dependencies

      - name: Install the dev tool chain
        run: make install_dev_tools

      # PHP has no gRPC server: tests/Tls/MutualTlsHandshakeTest.php runs its real TLS and mutual-TLS
      # handshakes against tests/Tls/tls_test_server.py, a python grpcio server it starts itself.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install grpcio for the TLS handshake test server
        run: python -m pip install grpcio==1.82.1

      # Packagist serves whatever is at the tag. Prove the tag is good BEFORE asking it to crawl.
      - name: Test with coverage (fails below 100% of the hand-written code)
        run: make coverage

      # `make publish` re-runs check_packagist_credentials and the dry run itself, so the release
      # is self-contained rather than relying on the steps above having happened.
      - name: Publish to Packagist
        if: steps.packagist.outputs.missing == ''
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
        run: make publish RELEASE_TAG=${{ github.ref_name }}

      # The only path that emits an annotation, and only when a secret is missing.
      - name: Report the skipped Packagist ping
        if: steps.packagist.outputs.missing != ''
        env:
          MISSING: ${{ steps.packagist.outputs.missing }}
        run: |
          echo "::warning::Packagist ping SKIPPED - repository secret(s) not set: $MISSING. The tag passed its tests; Packagist relies on the ping 'make release' sent (checked by 'make release_verify'). See README 'Publishing to Packagist'."
          {
            echo "## Packagist ping skipped"
            echo
            echo "Repository secret(s) not set: \`$MISSING\`."
            echo "The tagged tree passed its tests. Packagist relies on the ping \`make release\` sent with the"
            echo "devops-accounts credentials; \`make release_verify\` checks that Packagist serves the version."
          } >> "$GITHUB_STEP_SUMMARY"
